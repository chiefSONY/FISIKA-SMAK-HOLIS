<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamu dimana sih?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0a0a0a;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 255, 136, 0.02) 0%, transparent 50%);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 255, 136, 0.08);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 255, 136, 0.02);
            padding: 2.5rem;
            text-align: center;
        }

        /* ===== TULISAN HIJAU NEON ===== */
        .neon-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #00ff88;
            text-shadow: 
                0 0 10px rgba(0, 255, 136, 0.5),
                0 0 20px rgba(0, 255, 136, 0.4),
                0 0 40px rgba(0, 255, 136, 0.3),
                0 0 80px rgba(0, 255, 136, 0.2),
                0 0 120px rgba(0, 255, 136, 0.1);
            animation: neonPulse 2s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 
                    0 0 10px rgba(0, 255, 136, 0.5),
                    0 0 20px rgba(0, 255, 136, 0.4),
                    0 0 40px rgba(0, 255, 136, 0.3),
                    0 0 80px rgba(0, 255, 136, 0.2),
                    0 0 120px rgba(0, 255, 136, 0.1);
                opacity: 0.9;
            }
            100% {
                text-shadow: 
                    0 0 20px rgba(0, 255, 136, 0.8),
                    0 0 40px rgba(0, 255, 136, 0.6),
                    0 0 80px rgba(0, 255, 136, 0.4),
                    0 0 160px rgba(0, 255, 136, 0.3),
                    0 0 240px rgba(0, 255, 136, 0.15);
                opacity: 1;
            }
        }

        .neon-emoji {
            color: #00ff88;
            text-shadow: 
                0 0 10px rgba(0, 255, 136, 0.5),
                0 0 30px rgba(0, 255, 136, 0.3);
            animation: neonPulse 2s ease-in-out infinite alternate 0.5s;
        }

        .subtitle {
            color: rgba(0, 255, 136, 0.4);
            font-size: 0.85rem;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.05);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a1218;
            border-radius: 1.8rem;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 136, 0.06);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.02), inset 0 0 60px rgba(0, 255, 136, 0.02);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #0a1218;
        }

        .video-wrapper .placeholder {
            position: absolute;
            color: rgba(0, 255, 136, 0.2);
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            pointer-events: none;
            text-align: center;
        }

        .video-wrapper .placeholder i {
            font-size: 4rem;
            color: rgba(0, 255, 136, 0.06);
        }

        .video-wrapper .placeholder span {
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.05);
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.2rem;
            padding: 0.5rem 1.5rem;
            background: rgba(0, 255, 136, 0.02);
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 136, 0.04);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            animation: blink 1.4s infinite;
            box-shadow: 0 0 16px rgba(0, 255, 136, 0.4);
        }

        .status-dot.off {
            background: #ff4444;
            animation: none;
            box-shadow: 0 0 16px rgba(255, 68, 68, 0.3);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .status-text {
            color: rgba(0, 255, 136, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .status-text.off {
            color: #ff6666;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.1);
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 136, 0.06);
            background: rgba(0, 255, 136, 0.02);
            color: rgba(0, 255, 136, 0.4);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls button:hover {
            background: rgba(0, 255, 136, 0.04);
            border-color: rgba(0, 255, 136, 0.12);
            color: rgba(0, 255, 136, 0.7);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.02);
        }

        .controls button.active {
            background: rgba(0, 255, 136, 0.06);
            border-color: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.04);
        }

        .controls button i {
            font-size: 0.9rem;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: rgba(0, 255, 136, 0.15);
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.02);
        }

        .footer-note i {
            margin-right: 0.3rem;
        }

        .fa-spin {
            animation: fa-spin 1s infinite linear;
        }

        @keyframes fa-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
                border-radius: 1.8rem;
            }
            .neon-title {
                font-size: 2.4rem;
            }
            .video-wrapper {
                aspect-ratio: 4/3;
            }
            .controls button {
                padding: 0.4rem 1.2rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TULISAN HIJAU NEON -->
        <div class="neon-title">
            Kamu dimana sih? <span class="neon-emoji">🤔</span>
        </div>
        <div class="subtitle">━━━ WEBCAM STREAMING ━━━</div>

        <div class="video-wrapper">
            <video id="webcamStream" autoplay muted playsinline style="display:none;"></video>
            <div class="placeholder" id="webcamPlaceholder">
                <i class="fas fa-camera" id="placeholderIcon"></i>
                <span id="placeholderText">Mengaktifkan webcam...</span>
                <span style="font-size:0.7rem; opacity:0.3;">izinkan akses kamera</span>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Loading...</span>
        </div>

        <div class="controls">
            <button id="toggleBtn" onclick="toggleWebcam()">
                <i class="fas fa-stop"></i> Stop
            </button>
            <button onclick="captureSnapshot()">
                <i class="fas fa-camera"></i> Snapshot
            </button>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-alt"></i>
            Streaming aman · hanya untuk keperluan presentasi
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        let stream = null;
        let isStreaming = false;
        const video = document.getElementById('webcamStream');
        const placeholder = document.getElementById('webcamPlaceholder');
        const placeholderText = document.getElementById('placeholderText');
        const placeholderIcon = document.getElementById('placeholderIcon');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ===== START WEBCAM OTOMATIS =====
        window.addEventListener('load', function() {
            setTimeout(startWebcam, 500);
        });

        async function startWebcam() {
            try {
                statusDot.className = 'status-dot off';
                statusText.textContent = 'Loading...';
                statusText.className = 'status-text';
                placeholderText.textContent = 'Mengaktifkan webcam...';
                placeholderIcon.className = 'fas fa-spinner fa-spin';
                placeholder.style.display = 'flex';
                video.style.display = 'none';

                const mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: false
                });

                stream = mediaStream;
                video.srcObject = stream;
                await video.play();

                video.style.display = 'block';
                placeholder.style.display = 'none';
                isStreaming = true;

                toggleBtn.innerHTML = '<i class="fas fa-stop"></i> Stop';
                toggleBtn.className = 'active';
                statusDot.className = 'status-dot';
                statusText.textContent = 'LIVE';
                statusText.className = 'status-text';
                placeholderIcon.className = 'fas fa-camera';

            } catch (err) {
                console.error('Error accessing webcam:', err);
                placeholderText.textContent = '⚠️ Webcam tidak dapat diakses';
                placeholder.style.display = 'flex';
                video.style.display = 'none';
                placeholderIcon.className = 'fas fa-exclamation-triangle';
                statusDot.className = 'status-dot off';
                statusText.textContent = 'ERROR';
                statusText.className = 'status-text off';
                toggleBtn.innerHTML = '<i class="fas fa-play"></i> Start';
                toggleBtn.className = '';

                if (err.name === 'NotAllowedError') {
                    placeholderText.textContent = '⚠️ Izin kamera ditolak';
                } else if (err.name === 'NotFoundError') {
                    placeholderText.textContent = '⚠️ Webcam tidak ditemukan';
                }
            }
        }

        // ===== TOGGLE WEBCAM =====
        async function toggleWebcam() {
            if (isStreaming) {
                stopWebcam();
            } else {
                await startWebcam();
            }
        }

        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            video.style.display = 'none';
            placeholder.style.display = 'flex';
            placeholderText.textContent = 'Klik Start untuk akses webcam';
            placeholderIcon.className = 'fas fa-camera';
            isStreaming = false;

            toggleBtn.innerHTML = '<i class="fas fa-play"></i> Start';
            toggleBtn.className = '';
            statusDot.className = 'status-dot off';
            statusText.textContent = 'OFF';
            statusText.className = 'status-text off';
        }

        // ===== SNAPSHOT =====
        function captureSnapshot() {
            if (!isStreaming) {
                alert('Nyalakan webcam terlebih dahulu!');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = `snapshot_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Matikan webcam saat halaman ditutup
        window.addEventListener('beforeunload', function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>

</body>
</html>
